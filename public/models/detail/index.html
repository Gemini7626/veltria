<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model Details | VELTRIA</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0915;color:white;font:16px system-ui}header{padding:20px;border-bottom:1px solid #352845;display:flex;justify-content:space-between}header a{font-size:24px;font-weight:900;color:white;text-decoration:none}main{max-width:850px;margin:auto;padding:24px 16px}h1{overflow-wrap:anywhere;font-size:clamp(28px,7vw,44px)}.sub{color:#b9aec9}.panel{background:#1b152b;border:1px solid #382c4d;border-radius:18px;padding:18px;margin:20px 0}img{width:100%;max-height:470px;object-fit:contain;background:#29203e;border-radius:12px}button,a.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;background:linear-gradient(120deg,#7938ef,#bd44e9);color:white;font-weight:700;text-decoration:none;margin:6px 6px 6px 0}select{width:100%;padding:12px;border:1px solid #514064;border-radius:10px;background:#241a37;color:white}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gallery img{aspect-ratio:1;object-fit:cover}.desc{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.tags span{display:inline-block;background:#322443;border-radius:30px;padding:6px 10px;margin:4px;font-size:12px}</style><header><a href="/">✦ VELTRIA</a><span class="sub">MODEL DETAILS</span></header><main><p><a style="color:#c99aff" href="/models/">Models</a> / Chi tiết</p><p id="status" class="sub">Đang tải model...</p><div id="detail" hidden><img id="hero" alt="Ảnh model"><h1 id="name"></h1><p id="meta" class="sub"></p><button id="fav">♡ Yêu thích</button><a id="civitai" class="btn" target="_blank" rel="noopener noreferrer">↗ Civitai</a><section class="panel"><h2>Phiên bản</h2><select id="versions"></select><p id="base" class="sub"></p><div id="gallery" class="gallery"></div></section><section class="panel"><h2>Mô tả</h2><div id="description" class="desc"></div><div id="tags" class="tags"></div></section><section class="panel"><h2>Sử dụng model</h2><button id="use">✧ Chọn cho Image Studio</button><p class="sub">Lưu lựa chọn cho Image Studio. Chưa thể tạo ảnh nếu chưa kết nối backend chạy AI.</p></section></div></main><script>
const $=id=>document.getElementById(id),id=Number(new URLSearchParams(location.search).get('id'));let model;const fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450"><rect width="100%" height="100%" fill="#29203e"/><text x="50%" y="50%" text-anchor="middle" fill="#c5b1e8" font-size="32">VELTRIA</text></svg>');const fkey='veltria:favorites:v1';const favs=()=>{try{return JSON.parse(localStorage.getItem(fkey)||'[]')}catch{return []}};
$('hero').onerror=()=>{$('hero').onerror=null;$('hero').src=fallback};function favLabel(){$('fav').textContent=favs().some(x=>x.id===id)?'♥ Đã yêu thích':'♡ Yêu thích'}$('fav').onclick=()=>{const old=favs(),found=old.some(x=>x.id===id);const newer=old.filter(x=>x.id!==id);if(!found)newer.unshift({id,name:model.name,type:model.type,image:model.versions[0]?.images[0]||null});localStorage.setItem(fkey,JSON.stringify(newer.slice(0,200)));favLabel()};$('use').onclick=()=>{localStorage.setItem('veltria:selected-model',JSON.stringify({id,name:model.name,type:model.type,versionId:Number($('versions').value)}));$('use').textContent='✓ Đã lưu lựa chọn'};
function showVersion(){const v=model.versions.find(x=>String(x.id)===$('versions').value);if(!v)return;$('base').textContent='Base model: '+(v.baseModel||'Không rõ');$('gallery').replaceChildren();
const imgs=Array.isArray(v.images)?v.images:[];
if(!imgs.length){
  $('hero').src=fallback;
  $('hero').alt=model.previewStatus==="restricted"
    ?"Ảnh xem trước bị giới hạn"
    :"Chưa có ảnh xem trước";
  const note=document.createElement('p');
  note.className='sub';
  note.textContent=model.previewStatus==="restricted"
    ?"🔒 Ảnh xem trước bị giới hạn ở khu vực công khai."
    :"Phiên bản này chưa có ảnh xem trước.";
  $('gallery').append(note);
  return;
}
$('hero').alt='Ảnh xem trước '+model.name;
$('hero').src=imgs[0];v.images.forEach(url=>{const img=document.createElement('img');img.src=url;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{img.onerror=null;img.src=fallback};img.onclick=()=>{$('hero').src=url};$('gallery').append(img)})}
(async()=>{try{if(!Number.isSafeInteger(id)||id<1)throw Error('ID không hợp lệ');const r=await fetch('/api/model/'+id);const d=await r.json();if(!r.ok)throw Error(d.error||'API lỗi');model=d;$('name').textContent=d.name;$('meta').textContent=[d.type,d.creator&&'Tác giả: '+d.creator].filter(Boolean).join(' · ');$('civitai').href=d.url;$('versions').replaceChildren();d.versions.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.name;$('versions').append(o)});$('versions').onchange=showVersion;showVersion();const tmp=document.createElement('div');tmp.innerHTML=d.description||'Chưa có mô tả';$('description').textContent=tmp.textContent;$('tags').replaceChildren();d.tags.slice(0,25).forEach(t=>{const x=document.createElement('span');x.textContent=t;$('tags').append(x)});favLabel();$('status').hidden=true;$('detail').hidden=false}catch(e){$('status').textContent='Không tải được chi tiết: '+e.message}})();</script></html>
