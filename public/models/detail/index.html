<section class="panel"><h2>Mô tả</h2><div id="description" class="desc"></div><div id="tags" class="tags"></div></section><section class="panel"><h2>Sử dụng model</h2><button id="use">✧ Chọn cho Image Studio</button><p class="sub">Lưu lựa chọn cho Image Studio. Chưa thể tạo ảnh nếu chưa kết nối backend chạy AI.</p></section></div></main><div id="v21-lightbox" class="v21-lightbox" hidden role="dialog" aria-label="Xem ảnh lớn"><button id="v21-close" type="button" aria-label="Đóng ảnh">✕</button><img id="v21-large" alt="Ảnh model phóng lớn" loading="lazy" decoding="async"></div><div id="v6-viewer" class="v6-viewer" hidden role="dialog" aria-modal="true" aria-label="Xem ảnh và video mẫu"><button id="v6-close" type="button" aria-label="Đóng">✕</button><button id="v6-prev" type="button" aria-label="Trước">❮</button><span id="v6-count"></span><button id="v6-next" type="button" aria-label="Sau">❯</button><div id="v6-stage"></div></div><script>
const $=id=>document.getElementById(id),id=Number(new URLSearchParams(location.search).get('id'));let model;const fallback='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450"><rect width="100%" height="100%" fill="#29203e"/><circle cx="430" cy="120" r="180" fill="#643583" opacity=".48"/><path d="M-40 380 Q190 70 640 370" stroke="#ad73da" stroke-width="90" fill="none" opacity=".26"/></svg>');const fkey='veltria:model-favorites:v3';
const cacheKey='veltria:fav-cache';
function favs(){try{const x=JSON.parse(localStorage.getItem(fkey)||'[]');return Array.isArray(x)?x.map(String):[]}catch{return []}}
function saveFavs(x){try{localStorage.setItem(fkey,JSON.stringify(x))}catch{}}
function rememberModel(){try{const cache=JSON.parse(localStorage.getItem(cacheKey)||'{}');const images=(model.versions||[]).flatMap(v=>v.images||[]);cache[String(id)]={id,name:model.name,type:model.type,creator:model.creator,image:images[0]||null,previewImages:images,previewStatus:model.previewStatus};localStorage.setItem(cacheKey,JSON.stringify(cache))}catch{}}
$('hero').onerror=()=>{
 const selected=(model?.versions||[]).find(x=>String(x.id)===$('versions').value);
 const images=selected?.images||[];
 const current=$('hero').src;
 const index=images.indexOf(current);
 const next=images.slice(index+1).find(u=>u!==current);
 if(next){$('hero').src=next;return;}
 $('hero').onerror=null;$('hero').src=fallback;
};function favLabel(){const saved=favs().includes(String(id));$('fav').textContent=saved?'♥ Đã yêu thích':'♡ Yêu thích';$('fav').setAttribute('aria-pressed',String(saved))}
$('fav').onclick=()=>{if(!model)return;const old=favs();const found=old.includes(String(id));const newer=found?old.filter(x=>x!==String(id)):[String(id),...old];saveFavs(newer);if(!found)rememberModel();favLabel()};$('use').onclick=()=>{localStorage.setItem('veltria:selected-model',JSON.stringify({id,name:model.name,type:model.type,versionId:Number($('versions').value)}));$('use').textContent='✓ Đã lưu lựa chọn'};
let v6Items=[],v6Index=0;
function v6Media(version){
 const items=[],seen=new Set();
 const add=(url,type)=>{
  if(typeof url!=="string"||!/^https:\/\//i.test(url))return;
  if(seen.has(url))return;seen.add(url);
  const isVideo=type==="video"||/\.(mp4|webm|mov)(?:[?#]|$)/i.test(url);
  items.push({url,type:isVideo?"video":"image"});
 };
 for(const m of version.media||[]){
  if(!m||typeof m!=="object")continue;
  const type=String(m.type||"").toLowerCase();
  if(type==="image"||type==="video"||type==="gif")add(m.url,type);
 }
 for(const url of version.images||[])add(url,"image");
 return items;
}
function v6Show(index){
 if(!v6Items.length)return;
 v6Index=(index+v6Items.length)%v6Items.length;
 const item=v6Items[v6Index],stage=$("v6-stage");stage.replaceChildren();
 const el=document.createElement(item.type==="video"?"video":"img");
 if(item.type==="video"){el.controls=true;el.autoplay=true;el.playsInline=true;el.preload="metadata";}
 el.referrerPolicy="no-referrer";el.src=item.url;
 el.onerror=()=>{stage.textContent="Không tải được nội dung này. Hãy thử mục khác."};
 stage.append(el);$("v6-count").textContent=(v6Index+1)+" / "+v6Items.length;
}
function v6Open(index){
 if(!v6Items.length)return;
 $("v6-viewer").hidden=false;document.body.style.overflow="hidden";
 v6Show(index);
}
function v6Close(){
 $("v6-viewer").hidden=true;$("v6-stage").replaceChildren();
 document.body.style.overflow="";
}
$("v6-close").onclick=v6Close;
$("v6-prev").onclick=()=>v6Show(v6Index-1);
$("v6-next").onclick=()=>v6Show(v6Index+1);
$("v6-viewer").onclick=e=>{if(e.target===$("v6-viewer"))v6Close()};
document.addEventListener("keydown",e=>{
 if($("v6-viewer").hidden)return;
 if(e.key==="Escape")v6Close();
 if(e.key==="ArrowLeft")v6Show(v6Index-1);
 if(e.key==="ArrowRight")v6Show(v6Index+1);
});

function showDownloads(version){
 const box=document.getElementById("download-files");
 box.replaceChildren();

 const files=version?.files||[];

 if(!files.length){
  box.textContent="Chưa có thông tin tệp tải từ API.";
  return;
 }

 for(const file of files){
  const row=document.createElement("div");
  row.className="vel-file";

  const info=document.createElement("div");
  info.className="vel-file-info";

  const name=document.createElement("strong");
  name.textContent=file.name||"Model file";

  const meta=document.createElement("small");
  const size=Number(file.sizeKB);

  const sizeText=Number.isFinite(size)&&size>0
   ?(size/1024).toFixed(2)+" MB"
   :"Chưa rõ dung lượng";

  meta.textContent=[
   file.format||file.type||"File",
   sizeText
  ].join(" · ");

  info.append(name,meta);
  row.append(info);

  if(file.downloadUrl){
   const link=document.createElement("a");
   link.href=file.downloadUrl;
   link.target="_blank";
   link.rel="noopener noreferrer";
   link.textContent="⬇ Download";
   row.append(link);
  }else{
   const note=document.createElement("small");
   note.textContent="Không có URL tải";
   row.append(note);
  }

  box.append(row);
 }
}

let velGallerySource="all";
let velGalleryItems=[];
let velGalleryRequest=0;

function velMediaType(item){
 const type=String(item.type||"").toLowerCase();
 return type==="video" || /\.(mp4|webm)(?:[?#]|$)/i.test(item.url)
  ?"video":"image";
}

function velRenderGallery(){
 const gallery=$("gallery");
 gallery.replaceChildren();
 v6Items=[];

 const version=(model.versions||[])
  .find(x=>String(x.id)===$("versions").value);

 const samples=version?v6Media(version):[];

 const community=velGalleryItems
  .filter(x=>velGallerySource==="all" ||
   (x.sources||[]).includes(velGallerySource))
  .map(x=>({url:x.url,type:velMediaType(x)}));

 const seen=new Set();

 for(const item of [...(velGallerySource==="all"?samples:[]),...community]){
  if(seen.has(item.url))continue;
  seen.add(item.url);
  v6Items.push(item);
 }

 const status=$("vel-gallery-status");
 status.textContent=v6Items.length
  ?`${v6Items.length} ảnh/video · Ảnh phiên bản và cộng đồng`
  :"Chưa có ảnh/video từ nguồn được chọn.";

 const first=v6Items.find(x=>x.type==="image");
 $("hero").onerror=()=>{
  $("hero").onerror=null;
  $("hero").src=fallback;
 };
 $("hero").src=first?first.url:fallback;

 v6Items.forEach((item,i)=>{
  const btn=document.createElement("button");
  btn.type="button";
  btn.className="v6-item";
  btn.setAttribute("aria-label","Xem mẫu "+(i+1));

  const el=document.createElement(item.type==="video"?"video":"img");
  el.src=item.url;
  el.referrerPolicy="no-referrer";

  if(item.type==="video"){
   el.muted=true;
   el.preload="metadata";
   el.playsInline=true;
  }else{
   el.loading="lazy";
   el.alt="Mẫu "+(i+1);
  }

  el.onerror=()=>btn.remove();
  btn.append(el);

  if(item.type==="video"){
   const mark=document.createElement("span");
   mark.className="v6-play";
   mark.textContent="▶ Video";
   btn.append(mark);
  }

  btn.onclick=()=>{
   if(item.type==="image")$("hero").src=item.url;
   v6Open(i);
  };

  gallery.append(btn);
 });
}

async function velLoadGallery(){
 const requestId=++velGalleryRequest;
 velGalleryItems=[];
 $("vel-gallery-status").textContent="Đang tải Gallery hai nguồn...";
 velRenderGallery();

 try{
  const response=await fetch(
   "/api/model/gallery?modelId="+encodeURIComponent(id)+"&limit=100"
  );
  if(!response.ok)throw Error("Gallery API HTTP "+response.status);

  const data=await response.json();
  if(requestId!==velGalleryRequest)return;

  velGalleryItems=Array.isArray(data.items)?data.items:[];

  const red=data.sources?.find(x=>x.source==="red");
  const com=data.sources?.find(x=>x.source==="com");

  velRenderGallery();

  if(!red?.ok || !com?.ok){
   $("vel-gallery-status").textContent+=
    " · Một nguồn API hiện không phản hồi.";
  }
 }catch(e){
  if(requestId!==velGalleryRequest)return;
  velRenderGallery();
  $("vel-gallery-status").textContent+=
   " · Không tải được Gallery cộng đồng.";
 }
}

document.querySelectorAll("[data-gallery-source]").forEach(btn=>{
 btn.addEventListener("click",()=>{
  velGallerySource=btn.dataset.gallerySource;
  document.querySelectorAll("[data-gallery-source]").forEach(b=>{
   b.classList.toggle("active",b===btn);
  });
  v6Close();
  velRenderGallery();
 });
});

(async()=>{try{if(!Number.isSafeInteger(id)||id<1)throw Error('ID không hợp lệ');const r=await fetch('/api/model/'+id);const d=await r.json();if(!r.ok)throw Error(d.error||'API lỗi');model=d;$('name').textContent=d.name;$('meta').textContent=[d.type,d.creator&&'Tác giả: '+d.creator].filter(Boolean).join(' · ');$('civitai').href=d.url;$('versions').replaceChildren();d.versions.forEach(v=>{const o=document.createElement('option');o.value=v.id;o.textContent=v.name;$('versions').append(o)});$('versions').onchange=showVersion;showVersion();velLoadGallery();$('use').disabled=!(d.versions||[]).length;const tmp=document.createElement('div');tmp.innerHTML=d.description||'Chưa có mô tả';$('description').textContent=tmp.textContent;$('tags').replaceChildren();d.tags.slice(0,25).forEach(t=>{const x=document.createElement('span');x.textContent=t;$('tags').append(x)});favLabel();$('status').hidden=true;$('detail').hidden=false}catch(e){$('status').textContent='Không tải được chi tiết: '+e.message}})();</script></html>
