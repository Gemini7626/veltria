<script>
const API="/api/models";
const results=document.getElementById("results");
const status=document.getElementById("status");
const more=document.getElementById("more");
const query=document.getElementById("query");
const velSearchMode=document.getElementById("vel-search-mode");
const sort=document.getElementById("sort");
let type="",next=null,requestId=0,loading=false;
const seenIds=new Set();
let nextCursor=null;
const V3_KEY="veltria:model-favorites:v3";
let v3Favorites=new Set();
try{const data=JSON.parse(localStorage.getItem(V3_KEY)||"[]");if(Array.isArray(data))v3Favorites=new Set(data.map(String));}catch{}
let v3Only=false;
const v3Cards=new Map();
function v3Save(){try{localStorage.setItem(V3_KEY,JSON.stringify([...v3Favorites]));}catch{}}
function v3Update(){
  const count=document.getElementById("v3FavCount");
  count.textContent=v3Favorites.size+" model đã lưu trên thiết bị";
  const btn=document.getElementById("v3FavOnly");
  btn.classList.toggle("active",v3Only);
  btn.setAttribute("aria-pressed",String(v3Only));
  for(const [id,card] of v3Cards){
    const saved=v3Favorites.has(id);
    card.hidden=v3Only&&!saved;
    const fav=card.querySelector(".v3-fav");
    if(fav){fav.textContent=saved?"♥":"♡";fav.classList.toggle("saved",saved);fav.setAttribute("aria-label",saved?"Bỏ lưu model":"Lưu model yêu thích");fav.setAttribute("aria-pressed",String(saved));}
  }
}
document.getElementById("v3FavOnly").addEventListener("click",()=>{
 v3Only=!v3Only;
 v3Update();
 if(v3Only)showSavedModels();else load();
});

function el(tag,cls,text){
  const node=document.createElement(tag);
  if(cls)node.className=cls;
  if(text!==undefined)node.textContent=text;
  return node;
}


function velVideoPreview(model, card){
  const urls = (model.previewVideos || [])
    .filter(u => typeof u === "string" &&
      /^https:\/\//i.test(u));

  if(!urls.length) return false;

  const video = document.createElement("video");
  video.controls = true;
  video.preload = "none";
  video.playsInline = true;
  video.muted = true;
  video.style.cssText =
    "width:100%;aspect-ratio:1/1;object-fit:cover;" +
    "background:#160d23;border-radius:12px;";

  video.src = urls[0];

  video.addEventListener("click", e => {
    e.preventDefault();
    e.stopPropagation();
  });

  video.addEventListener("error", () => {
    const next = urls.indexOf(video.src) + 1;
    if(next < urls.length) video.src = urls[next];
  });

  card.prepend(video);
  return true;
}

function render(model){
 if(v3Favorites.has(String(model.id))){
  try{
   const cache=JSON.parse(localStorage.getItem("veltria:fav-cache")||"{}");
   cache[String(model.id)]=model;
   localStorage.setItem("veltria:fav-cache",JSON.stringify(cache));
  }catch{}
 }
  const card=el("a","card");
  card.href="/models/detail/?id="+encodeURIComponent(model.id);
  card.removeAttribute("target");
  card.rel="noopener noreferrer";


  const image=model.image;
  const candidates=[
    ...new Set(
      [image,...(Array.isArray(model.previewImages)
        ? model.previewImages:[])]
      .filter(u=>typeof u==="string" && /^https:\/\//i.test(u))
    )
  ];

  const img=el("img");
  img.alt=model.name||"Model";
  img.loading="lazy";
  img.decoding="async";
  img.referrerPolicy="no-referrer";

  let index=0;
  let recovered=false;

  function unavailable(){
    img.onerror=null;

    if((model.previewVideos || []).length){
      img.remove();
      if(velVideoPreview(model,card)) return;
    }

    const fallback=el("div","v2-placeholder");
    const message=el(
      "div","",
      "✦ Ảnh chưa tải được"
    );
    const retry=el("button","");
    retry.type="button";
    retry.textContent="↻ Thử tải lại ảnh";

    retry.style.cssText=[
      "margin-top:12px",
      "padding:8px 12px",
      "border:1px solid #a855f7",
      "border-radius:10px",
      "background:#29163d",
      "color:white",
      "cursor:pointer"
    ].join(";");

    retry.onclick=event=>{
      event.preventDefault();
      event.stopPropagation();

      index=0;
      recovered=false;
      img.onerror=()=>{void tryNext();};

      fallback.replaceWith(img);

      if(candidates.length){
        img.src=candidates[0];
      }else{
        void tryNext();
      }
    };

    fallback.append(message,retry);
    img.replaceWith(fallback);
  }

  async function tryNext(){
    index++;
    if(index<candidates.length){
      img.src=candidates[index];
      return;
    }

    if(!recovered && model.id!=null){
      recovered=true;
      const result=await v4PreviewLookup(model.id);
      if(!img.isConnected)return;

      if(result){
        model.previewStatus=result.previewStatus;
        for(const url of result.previewImages||[]){
          if(typeof url==="string"
             && /^https:\/\//i.test(url)
             && !candidates.includes(url)){
            candidates.push(url);
          }
        }
      }

      if(index<candidates.length){
        img.src=candidates[index];
        return;
      }
    }
    unavailable();
  }

  img.onerror=()=>{void tryNext();};

  if(candidates.length){
    img.src=candidates[0];
    card.append(img);
  }else{
    const placeholder=el("div","v2-placeholder",
      model.previewStatus==="restricted"
        ?"🔒 Ảnh giới hạn"
        :"✦ Đang tìm ảnh mẫu");
    if(!velVideoPreview(model,card)){
      card.append(placeholder);
      if(model.id!=null)
        v4ResolvePreview(model,card);
    }
  }

  const modelId=String(model.id);
  const fav=el("button","v3-fav");
  fav.type="button";
  fav.addEventListener("click",event=>{
    event.preventDefault();event.stopPropagation();
    if(v3Favorites.has(modelId))v3Favorites.delete(modelId);
    else v3Favorites.add(modelId);
    v3Save();v3Update();
    if(v3Only)showSavedModels();
  });
  card.append(fav);
  const info=el("div","info");
  info.append(el("h3","",model.name||"Chưa có tên"));
  info.append(el("p","",model.type||"Model"));
  if(model.creator)info.append(el("p","v3-creator","@"+model.creator));
  card.append(info);
  results.append(card);
  v3Cards.set(modelId,card);
  v3Update();
}

// Shared, bounded preview recovery for Civitai list results.
const v4PreviewCache=new Map();
const v4PreviewPending=new Map();
let v4PreviewActive=0;
const v4PreviewQueue=[];
function v4PreviewTask(fn){
 return new Promise(resolve=>{
  v4PreviewQueue.push({fn,resolve});v4PreviewDrain();
 });
}
function v4PreviewDrain(){
 while(v4PreviewActive<4 && v4PreviewQueue.length){
  const task=v4PreviewQueue.shift();v4PreviewActive++;
  Promise.resolve().then(task.fn).then(task.resolve,()=>task.resolve(null))
   .finally(()=>{v4PreviewActive--;v4PreviewDrain()});
 }
}
async function v4PreviewLookup(id){
 const key=String(id);
 if(v4PreviewCache.has(key))return v4PreviewCache.get(key);
 if(v4PreviewPending.has(key))return v4PreviewPending.get(key);
 const promise=v4PreviewTask(async()=>{
  try{
   const response=await fetch('/api/model/'+encodeURIComponent(key));
   if(!response.ok)return null;
   const d=await response.json();
   const urls=(d.versions||[]).flatMap(v=>v.images||[])
    .filter(u=>typeof u==='string' && u.startsWith('https://'));
   const result={image:urls[0]||null,previewImages:[...new Set(urls)].slice(0,48),previewStatus:d.previewStatus||'unknown'};
   v4PreviewCache.set(key,result);
   return result;
  }catch{return null}
 });
 v4PreviewPending.set(key,promise);
 promise.finally(()=>v4PreviewPending.delete(key));
 return promise;
}
async function v4ResolvePreview(model,card){
 const result=await v4PreviewLookup(model.id);
 if(!result || !card.isConnected)return;
 model.previewStatus=result.previewStatus;
 if(!result.image){
  const place=card.querySelector('.v2-placeholder');
  if(place)place.textContent=result.previewStatus==='restricted'
   ?'🔒 Ảnh giới hạn':'✦ Chưa có ảnh công khai';
  return;
 }
 model.image=result.image;
 model.previewImages=result.previewImages;
 const place=card.querySelector('.v2-placeholder');
 if(!place)return;
 const img=el('img');
 img.alt=model.name||'Model';img.loading='lazy';img.referrerPolicy='no-referrer';
 let index=0;
 img.onerror=()=>{
  index++;
  if(index<result.previewImages.length)img.src=result.previewImages[index];
  else {img.onerror=null;img.replaceWith(el('div','v2-placeholder','✦ Ảnh không tải được'));}
 };
 img.src=result.image;
 place.replaceWith(img);
 if(v3Favorites.has(String(model.id))){
  try{
   const cache=JSON.parse(localStorage.getItem('veltria:fav-cache')||'{}');
   cache[String(model.id)]=model;
   localStorage.setItem('veltria:fav-cache',JSON.stringify(cache));
  }catch{}
 }
}

async function showSavedModels(){
 const token=++requestId;
 loading=false;
 results.replaceChildren();
 v3Cards.clear();
 more.hidden=true;
 next=null;
 nextCursor=null;
 status.textContent="Đang tải model yêu thích...";

 let cache={};
 try{cache=JSON.parse(localStorage.getItem("veltria:fav-cache")||"{}")}catch{}

 const ids=[...v3Favorites];
 for(const modelId of ids){
  if(token!==requestId||!v3Only)return;
  let model=cache[modelId];

  if(!model){
   try{
    const response=await fetch("/api/model/"+encodeURIComponent(modelId));
    if(response.ok){
     const detail=await response.json();
     const images=(detail.versions||[]).flatMap(v=>v.images||[]);
     model={
      id:detail.id,name:detail.name,type:detail.type,
      creator:detail.creator,image:images[0]||null,
      previewImages:images,previewStatus:detail.previewStatus
     };
     cache[modelId]=model;
    }
   }catch{}
  }

  if(!model)model={id:modelId,name:"Model #"+modelId,type:"Model"};

  const q=query.value.trim().toLowerCase();
  if(type&&model.type!==type)continue;
  if(q&&!String(model.name||"").toLowerCase().includes(q))continue;
  render(model);
 }

 if(token!==requestId)return;
 try{localStorage.setItem("veltria:fav-cache",JSON.stringify(cache))}catch{}
 status.textContent="Đang hiển thị "+results.children.length+
  " / "+v3Favorites.size+" model yêu thích.";
}


// VELTRIA v5 - relevance ranking
function v5Normalize(value){
  return String(value||"")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g,"")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g," ")
    .trim();
}

function v5Score(model,keyword){
  const name=v5Normalize(model.name);
  const creator=v5Normalize(model.creator);
  const q=v5Normalize(keyword);

  if(!q)return 0;
  if(name===q)return 1000;
  if(name.startsWith(q))return 850;
  if(name.includes(q))return 700;

  const words=q.split(" ").filter(Boolean);
  const matched=words.filter(w=>name.includes(w));

  let score=matched.length*80;

  if(words.length && matched.length===words.length){
    score+=200;
  }

  if(creator.includes(q))score+=100;
  if(model.image)score+=5;

  return score;
}

async function load(append=false){
 if(v3Only){await showSavedModels();return;}
  if(append && loading)return;
  const id=++requestId;
  loading=true;
  if(!append){ results.replaceChildren(); v3Cards.clear(); next=null; nextCursor=null; seenIds.clear(); }
  more.hidden=true;
  status.textContent="Đang tải model...";
  const params=new URLSearchParams({
    mode:"public",
    sort:sort.value==="Relevance"
      ?"Newest"
      :sort.value
  });
  const extendedType =
    document.getElementById("vel-type-select")?.value || "";
  if(extendedType)params.set("type",extendedType);
  else if(type)params.set("type",type);
  if(query.value.trim())params.set(velSearchMode.value==="creator"?"username":"query",query.value.trim());

  try{
    if(append){
      if(nextCursor) params.set("cursor",nextCursor);
      else if(next) params.set("page",String(next));
      else { loading=false; return; }
    }
    const searchActive=query.value.trim().length>0;
    const apiUrl=API+"?"+params.toString();
    const response=await fetch(apiUrl);
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(id!==requestId)return;

    const items=[...(data.items||[])];


    for(const model of items){
      if(model.id==null || seenIds.has(String(model.id))) continue;
      seenIds.add(String(model.id));
      render(model);
    }
    v3Update();
    nextCursor=data.nextCursor||null;
    next=data.hasMore ? (data.nextPage || (nextCursor ? null : Number(data.page)+1)) : null;
    if(!data.hasMore || (!nextCursor && !next)) next=null;
    more.hidden=!(nextCursor || next);
    loading=false;
    const visible=[...v3Cards.values()].filter(card=>!card.hidden).length;
    status.textContent=results.children.length
      ? "Đã tải "+results.children.length+" model công khai. "+(v3Only?"Đang hiển thị "+visible+" model đã lưu trong kết quả.":"")
      : "Chưa tìm thấy model phù hợp.";
  }catch(err){
    if(id!==requestId)return;
    loading=false;
    status.replaceChildren();
    status.append("Không thể tải API Civitai lúc này. ");
    const link=el("a","","Mở Civitai");
    link.href="https://civitai.red/models";
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.style.color="#c69bff";
    status.append(link);
  }
}


// VELTRIA v4.7.1 - persistent search state
function v471SaveState(){
  const url = new URL(window.location.href);
  const keyword = query.value.trim();

  if(keyword) url.searchParams.set("q", keyword);
  else url.searchParams.delete("q");

  if(type) url.searchParams.set("type", type);
  else url.searchParams.delete("type");

  if (sort.value !== "Most Downloaded")
    url.searchParams.set("sort", sort.value);
  else
    url.searchParams.delete("sort");

  url.searchParams.set("mode", velSearchMode.value);
  history.replaceState(null, "", url);
}

function v471RestoreState(){
  const params = new URLSearchParams(
    window.location.search
  );

  query.value = params.get("q") || "";
velSearchMode.value = params.get("mode")==="creator"?"creator":"model";

  type = params.get("type") || "";const typeSelect = document.getElementById("vel-type-select");if(typeSelect && [...typeSelect.options].some(o => o.value === type))typeSelect.value = type;

    const requestedSort = params.get("sort");

  if(
    requestedSort &&
    [...sort.options].some(
      o => o.value === requestedSort
    )
  ){
    sort.value = requestedSort;
  }
}

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  const u=new URL(window.location.href);
  u.searchParams.set("mode",velSearchMode.value);
  history.replaceState(null,"",u);
  v471SaveState();
  load();
});

sort.addEventListener("change",()=>{
  v471SaveState();
  load();
});

// VELTRIA Infinite Scroll
let veltriaScrollBusy = false;

async function veltriaAutoLoad() {
  if (veltriaScrollBusy) return;
  if (!(nextCursor || next)) return;

  const remaining =
    document.documentElement.scrollHeight -
    window.innerHeight -
    window.scrollY;

  if (remaining > 1000) return;

  veltriaScrollBusy = true;

  try {
    await load(true);
  } finally {
    veltriaScrollBusy = false;
  }
}

window.addEventListener("scroll", veltriaAutoLoad, {
  passive: true
});

window.addEventListener("resize", veltriaAutoLoad);

// Kiem tra tai them sau khi render
const veltriaOriginalLoad = load;
load = async function(append=false) {
  const result = await veltriaOriginalLoad(append);
  if (nextCursor || next) {
    requestAnimationFrame(veltriaAutoLoad);
  }
  return result;
};


// Ẩn nút Tải thêm
more.hidden = true;
more.style.display = "none";

v471RestoreState();
load();
document.getElementById("vel-type-select")?.addEventListener(
  "change", () => load(false)
);
</script>
