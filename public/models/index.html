<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Hub | VELTRIA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0915;color:#f8f5ff;font-family:system-ui,Arial,sans-serif}
header{padding:18px 20px;border-bottom:1px solid #29233c;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:23px;font-weight:900;color:white;text-decoration:none;letter-spacing:.4px}
main{max-width:1100px;margin:auto;padding:24px 16px 50px}
.eyebrow{color:#bd91ff;font-size:12px;font-weight:800;letter-spacing:2px}
h1{font-size:clamp(30px,7vw,52px);margin:10px 0;background:linear-gradient(90deg,#fff,#bc82ff,#ff8bce);color:transparent;background-clip:text}
.sub{color:#b3aac7;line-height:1.6}
.search{display:flex;gap:8px;margin:24px 0 16px}
input,select{background:#1a152b;border:1px solid #403455;border-radius:12px;color:white;padding:13px;min-width:0}
input{flex:1}
button{background:linear-gradient(120deg,#7938ef,#bd44e9);border:0;color:white;border-radius:12px;padding:12px 17px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.filters button{background:#211a34;border:1px solid #403455}
.filters button.active{background:#7839dd;border-color:#ac79ff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#191329;border:1px solid #302640;border-radius:17px;overflow:hidden;text-decoration:none;color:white}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#27203b;display:block}
.info{padding:13px}
.info h3{font-size:14px;margin:0 0 8px;overflow-wrap:anywhere}
.info p{font-size:12px;color:#b7accd;margin:0}
.status{color:#b8accf;margin:20px 0;line-height:1.6}
.card:hover{border-color:#a46bff}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<a href="/" class="brand">✦ VELTRIA</a>
<span style="color:#bca9d9;font-size:13px">MODEL HUB</span>
</header>
<main>
<div class="eyebrow">DISCOVER AI MODELS</div>
<h1>Explore Models.</h1>
<p class="sub">Khám phá Checkpoint và LoRA. Chọn model phù hợp với phong cách sáng tạo của bạn.</p>

<form class="search" id="searchForm">
<input id="query" placeholder="Tìm tên model..." aria-label="Tên model">
<button type="submit">Tìm</button>
</form>

<div class="filters">
<button type="button" class="active" data-type="">Tất cả</button>
<button type="button" data-type="Checkpoint">Checkpoint</button>
<button type="button" data-type="LORA">LoRA</button>
<select id="sort" aria-label="Sắp xếp">
<option value="Most Downloaded">Phổ biến</option>
<option value="Newest">Mới nhất</option>
<option value="Highest Rated">Đánh giá cao</option>
</select>
</div>

<p class="status" id="status">Đang tải danh sách model...</p>
<div class="grid" id="results"></div>
<div style="text-align:center;margin-top:24px">
<button id="more" type="button" hidden>Tải thêm</button>
</div>
</main>
<script>
const API="/api/models";
const results=document.getElementById("results");
const status=document.getElementById("status");
const more=document.getElementById("more");
const query=document.getElementById("query");
const sort=document.getElementById("sort");
let type="",next=null,requestId=0;

function el(tag,cls,text){
  const node=document.createElement(tag);
  if(cls)node.className=cls;
  if(text!==undefined)node.textContent=text;
  return node;
}

function render(model){
  const card=el("a","card");
  card.href=model.url;
  card.target="_blank";
  card.rel="noopener noreferrer";

  const image=model.image;

  if(image){
    const img=el("img");
    img.src=image;
    img.alt=model.name || "Model";
    img.loading="lazy";
    img.referrerPolicy="no-referrer";
    card.append(img);
  }else{
    const placeholder=el("div");
    placeholder.style.cssText="aspect-ratio:3/4;display:grid;place-items:center;background:#29203e;color:#c5b1e8";
    placeholder.textContent="✦ VELTRIA";
    card.append(placeholder);
  }

  const info=el("div","info");
  info.append(el("h3","",model.name||"Chưa có tên"));
  info.append(el("p","",model.type||"Model"));
  card.append(info);
  results.append(card);
}

async function load(append=false){
  const id=++requestId;
  if(!append){
    results.replaceChildren();
    next=null;
  }
  more.hidden=true;
  status.textContent="Đang tải model...";
  const params=new URLSearchParams({
    mode:"public",
    sort:sort.value
  });
  if(type)params.set("type",type);
  if(query.value.trim())params.set("query",query.value.trim());

  try{
    const response=await fetch(
      API+"?"+params.toString()+"&page="+(append&&next?next:1)
    );
    if(!response.ok)throw new Error("HTTP "+response.status);
    const data=await response.json();
    if(id!==requestId)return;

    const items=data.items||[];
    items.forEach(render);
    next=data.hasMore ? (Number(data.page)+1) : null;
    more.hidden=!next;
    status.textContent=results.children.length
      ? "Đã hiển thị "+results.children.length+" model công khai."
      : "Chưa tìm thấy model phù hợp.";
  }catch(err){
    if(id!==requestId)return;
    status.replaceChildren();
    status.append("Không thể tải API Civitai lúc này. ");
    const link=el("a","","Mở Civitai");
    link.href="https://civitai.com/models";
    link.target="_blank";
    link.rel="noopener noreferrer";
    link.style.color="#c69bff";
    status.append(link);
  }
}

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  load();
});
document.querySelectorAll("[data-type]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-type]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    type=btn.dataset.type;
    load();
  });
});
sort.addEventListener("change",()=>load());
more.addEventListener("click",()=>{if(next)load(true)});
load();
</script>
</body>
</html>
