<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anime Library | VELTRIA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#151b32;border-bottom:1px solid #303954}
header a{color:#a5b4fc;text-decoration:none}
h1{margin:18px 0 8px;font-size:26px}
header p{color:#aab5ce;margin:0}
main{max-width:1100px;margin:auto;padding:20px 14px}
input{width:100%;padding:14px;border-radius:12px;background:#1e293b;border:1px solid #475569;color:white;font-size:16px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:#192238;border:1px solid #303b56;border-radius:14px;overflow:hidden}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#28344a}
.info{padding:12px}
.info h2{font-size:15px;margin:0 0 10px;line-height:1.4}
.info p{font-size:13px;color:#bac5d9;margin:5px 0}
#status{color:#bac5d9;margin-bottom:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<a href="/">← VELTRIA</a>
<h1>Anime Library</h1>
<p>Khám phá danh sách Anime từ AniList</p>
</header>
<main>
<input id="search" type="search" placeholder="Tìm kiếm Anime...">
<div id="status">Đang tải danh sách...</div>
<div class="grid" id="grid"></div>
</main>
<script>
let animeList=[];
const grid=document.getElementById("grid");
const statusEl=document.getElementById("status");

function render(items){
 grid.replaceChildren();
 statusEl.textContent=items.length+" Anime";
 for(const anime of items){
  const card=document.createElement("article");
  card.className="card";
  const img=document.createElement("img");
  img.loading="lazy";
  img.alt=anime.title_english||anime.title_romaji||"Anime";
  if(anime.cover_image && /^https:\/\//.test(anime.cover_image)){
   img.src=anime.cover_image;
  }
  const info=document.createElement("div");
  info.className="info";
  const title=document.createElement("h2");
  title.textContent=anime.title_english||anime.title_romaji||"Chưa có tên";
  const details=document.createElement("p");
  details.textContent=(anime.season_year||"Chưa rõ năm")+" • "+(anime.episodes??"?")+" tập";
  const state=document.createElement("p");
  state.textContent=anime.status||"";
  info.append(title,details,state);
  card.append(img,info);
  grid.append(card);
 }
}

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.trim().toLowerCase();
 render(animeList.filter(a=>
  [a.title_romaji,a.title_english,a.title_native]
  .some(t=>String(t||"").toLowerCase().includes(q))
 ));
});

fetch("/api/anime",{cache:"no-store"})
 .then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()})
 .then(data=>{
  if(!data.ok||!Array.isArray(data.anime))throw Error("Dữ liệu không hợp lệ");
  animeList=data.anime;
  render(animeList);
 })
 .catch(err=>{
  statusEl.textContent="Không tải được Anime: "+err.message;
 });
</script>
</body>
</html>
